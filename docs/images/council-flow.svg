<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="AI council flow">
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .card { fill: #111c31; stroke: #334155; stroke-width: 1.4; }
      .seat { fill: #111c31; stroke: #38bdf8; stroke-width: 1.4; }
      .seat2 { fill: #111c31; stroke: #a78bfa; stroke-width: 1.4; }
      .h { fill: #f8fafc; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 15px; font-weight: 700; }
      .t { fill: #e2e8f0; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 13px; }
      .s { fill: #94a3b8; font-family: Segoe UI, Microsoft YaHei, sans-serif; font-size: 12px; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="560"/>
  <text x="40" y="48" class="h" font-size="20">AI Council · flow</text>
  <text x="40" y="72" class="s">Independent proposals → anonymous review → weighted convergence → execution → independent verification.</text>

  <!-- seats -->
  <rect x="40" y="105" width="180" height="60" class="seat" rx="10"/>
  <text x="60" y="132" class="h">Architect</text>
  <text x="60" y="152" class="s">boundaries / contracts</text>

  <rect x="40" y="175" width="180" height="60" class="seat" rx="10"/>
  <text x="60" y="202" class="h">Coder</text>
  <text x="60" y="222" class="s">implementation / edges</text>

  <rect x="40" y="245" width="180" height="60" class="seat" rx="10"/>
  <text x="60" y="272" class="h">Critic</text>
  <text x="60" y="292" class="s">premises / kill criteria</text>

  <rect x="40" y="315" width="180" height="60" class="seat" rx="10"/>
  <text x="60" y="342" class="h">Vision</text>
  <text x="60" y="362" class="s">image / structure</text>

  <rect x="40" y="385" width="180" height="60" class="seat" rx="10"/>
  <text x="60" y="412" class="h">Scholar</text>
  <text x="60" y="432" class="s">intent / language</text>

  <!-- stage 1 -->
  <rect x="300" y="180" width="180" height="190" class="card" rx="10"/>
  <text x="320" y="212" class="h">1 · Proposals</text>
  <text x="320" y="240" class="s">same context pack</text>
  <text x="320" y="260" class="s">different checklists</text>
  <text x="320" y="280" class="s">≤400 words each</text>
  <text x="320" y="300" class="s">parallel, no cross-talk</text>

  <!-- stage 2 -->
  <rect x="550" y="180" width="170" height="190" class="card" rx="10"/>
  <text x="570" y="212" class="h">2 · Review</text>
  <text x="570" y="240" class="s">A/B/C anonymous</text>
  <text x="570" y="260" class="s">hard flaws</text>
  <text x="570" y="280" class="s">new insight</text>
  <text x="570" y="300" class="s">ranking</text>

  <!-- stage 3 -->
  <rect x="790" y="105" width="140" height="120" class="card" rx="10"/>
  <text x="810" y="137" class="h">3 · Score</text>
  <text x="810" y="163" class="s">weighted Borda</text>
  <text x="810" y="183" class="s">mean reference</text>
  <text x="810" y="203" class="s">reversible if split</text>

  <!-- stage 4 -->
  <rect x="790" y="255" width="140" height="120" class="card" rx="10"/>
  <text x="810" y="287" class="h">4 · Execute</text>
  <text x="810" y="313" class="s">evidence file</text>
  <text x="810" y="333" class="s">raw output</text>
  <text x="810" y="353" class="s">verifier reruns</text>

  <!-- stage 5 -->
  <rect x="790" y="405" width="140" height="100" class="card" rx="10"/>
  <text x="810" y="437" class="h">5 · Degrade</text>
  <text x="810" y="463" class="s">retry → backup model</text>
  <text x="810" y="483" class="s">&lt;3 seats → stop</text>

  <!-- arrows -->
  <path class="arrow" d="M 220 135 L 295 220"/>
  <path class="arrow" d="M 220 205 L 295 235"/>
  <path class="arrow" d="M 220 275 L 295 265"/>
  <path class="arrow" d="M 220 345 L 295 300"/>
  <path class="arrow" d="M 220 415 L 295 335"/>
  <path class="arrow" d="M 480 275 L 545 275"/>
  <path class="arrow" d="M 720 240 L 785 180"/>
  <path class="arrow" d="M 860 225 L 860 250"/>
  <path class="arrow" d="M 860 375 L 860 400"/>

  <text x="40" y="510" class="s">P0 = an existing plan the user already accepted. It joins the anonymous pool, gets no special marker, and is kept if within 15% of the top score.</text>
  <text x="40" y="532" class="s">Output: conclusion, seat table, disagreement, changes, verification, risk, archive path.</text>
</svg>